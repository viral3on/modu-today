<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-Day 디데이 및 날짜 계산기 | 만 나이·기념일</title>
  <meta name="description" content="목표일까지 남은 D-Day 일수, 사귄 날짜 기념일(100일/1000일), 생년월일 기준 만 나이를 정확하게 계산합니다.">
  
  <!-- 구글 애드센스 메타 태그 & 스크립트 -->
  <meta name="google-adsense-account" content="ca-pub-6122968996738347">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6122968996738347" crossorigin="anonymous"></script>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased py-10 px-4">

  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg border border-gray-100 p-6 md:p-8">
    
    <!-- 상단 네비게이션 -->
    <nav class="flex flex-wrap gap-2 justify-between items-center mb-6 border-b pb-3 text-xs md:text-sm">
      <div class="flex gap-3">
        <a href="/" class="text-gray-500 hover:text-blue-600">대출</a>
        <a href="/salary.html" class="text-gray-500 hover:text-blue-600">연봉</a>
        <a href="/counter.html" class="text-gray-500 hover:text-blue-600">글자수</a>
        <a href="/compound.html" class="text-gray-500 hover:text-blue-600">복리</a>
      </div>
      <span class="text-blue-600 font-bold">D-Day 계산기</span>
    </nav>

    <header class="text-center mb-6">
      <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2">D-Day 및 날짜 계산기</h1>
      <p class="text-sm text-gray-500">목표일 D-Day, 기념일 계산, 만 나이를 한 번에 확인합니다.</p>
    </header>

    <div class="space-y-4">
      
      <!-- 계산 모드 선택 -->
      <div class="grid grid-cols-2 gap-2">
        <label class="cursor-pointer">
          <input type="radio" name="calcMode" value="dday" class="peer sr-only" checked onchange="switchMode()">
          <div class="text-center py-2.5 px-3 text-sm font-medium border border-gray-300 rounded-lg peer-checked:bg-blue-600 peer-checked:text-white peer-checked:border-blue-600 transition">
            D-Day 계산 (남은/지난 날)
          </div>
        </label>
        <label class="cursor-pointer">
          <input type="radio" name="calcMode" value="anniversary" class="peer sr-only" onchange="switchMode()">
          <div class="text-center py-2.5 px-3 text-sm font-medium border border-gray-300 rounded-lg peer-checked:bg-blue-600 peer-checked:text-white peer-checked:border-blue-600 transition">
            기념일 계산 (100일·1000일 후)
          </div>
        </label>
      </div>

      <!-- 기준일 입력 -->
      <div>
        <label id="dateLabel" class="block text-sm font-semibold text-gray-700 mb-1">목표 기준 날짜 선택</label>
        <input type="date" id="targetDate" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-base">
      </div>

      <button onclick="calculateDate()" 
              class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg transition duration-200 shadow-md">
        날짜 계산하기
      </button>
    </div>

    <!-- 결과 영역 -->
    <div id="resultBox" class="hidden mt-8 pt-6 border-t border-gray-200">
      <h2 class="text-lg font-bold text-gray-900 mb-4">📅 계산 결과</h2>
      
      <div class="bg-blue-50 p-5 rounded-xl mb-6 text-center">
        <span id="resultTitle" class="text-xs text-blue-600 font-semibold">D-Day 결과</span>
        <p id="mainDdayResult" class="text-3xl md:text-4xl font-black text-blue-900 mt-1">D-Day</p>
        <p id="subDdayNote" class="text-xs text-blue-500 mt-1 font-medium"></p>
      </div>

      <!-- 기념일 리스트 (기념일 모드일 때 표시) -->
      <div id="annivList" class="hidden bg-gray-50 p-4 rounded-xl text-sm space-y-2 text-gray-600">
        <div class="flex justify-between"><span>100일 되는 날:</span><span id="d100" class="font-semibold text-gray-900"></span></div>
        <div class="flex justify-between"><span>200일 되는 날:</span><span id="d200" class="font-semibold text-gray-900"></span></div>
        <div class="flex justify-between"><span>1년(365일) 되는 날:</span><span id="d365" class="font-semibold text-gray-900"></span></div>
        <div class="flex justify-between"><span>1000일 되는 날:</span><span id="d1000" class="font-semibold text-gray-900"></span></div>
      </div>
    </div>

    <!-- SEO 설명 콘텐츠 -->
    <article class="mt-8 pt-6 border-t border-gray-100 text-sm text-gray-600 leading-relaxed space-y-3">
      <h3 class="font-bold text-gray-900">D-Day 계산 방식 기준</h3>
      <ul class="list-disc pl-4 space-y-1">
        <li><strong>D-Day (목표일):</strong> 오늘을 0일로 산정하여 목표 날짜까지 남은 순수 일수를 카운트합니다.</li>
        <li><strong>기념일 (사귄 날/출생일):</strong> 시작일 당일을 1일째로 포함하여 100일, 1000일 등의 날짜를 산출합니다.</li>
      </ul>
    </article>

  </div>

  <script>
    function switchMode() {
      const mode = document.querySelector('input[name="calcMode"]:checked').value;
      const label = document.getElementById('dateLabel');
      label.innerText = (mode === 'dday') ? '목표 기준 날짜 선택' : '시작 기준 날짜 선택 (사귄 날/입사일 등)';
      document.getElementById('resultBox').classList.add('hidden');
    }

    function calculateDate() {
      const dateVal = document.getElementById('targetDate').value;
      if (!dateVal) {
        alert('날짜를 선택해 주세요.');
        return;
      }

      const mode = document.querySelector('input[name="calcMode"]:checked').value;
      const selected = new Date(dateVal);
      const today = new Date();
      
      // 시간 제거 후 날짜 단위 비교
      selected.setHours(0,0,0,0);
      today.setHours(0,0,0,0);

      const diffTime = selected.getTime() - today.getTime();
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

      if (mode === 'dday') {
        document.getElementById('annivList').classList.add('hidden');
        document.getElementById('resultTitle').innerText = 'D-Day 카운트';

        if (diffDays === 0) {
          document.getElementById('mainDdayResult').innerText = 'D-DAY (오늘)';
          document.getElementById('subDdayNote').innerText = '오늘이 바로 그 날입니다!';
        } else if (diffDays > 0) {
          document.getElementById('mainDdayResult').innerText = `D-${diffDays}`;
          document.getElementById('subDdayNote').innerText = `목표일까지 앞으로 ${diffDays}일 남았습니다.`;
        } else {
          document.getElementById('mainDdayResult').innerText = `D+${Math.abs(diffDays)}`;
          document.getElementById('subDdayNote').innerText = `기준일로부터 ${Math.abs(diffDays)}일 지났습니다.`;
        }
      } else {
        // 기념일 계산 모드 (당일 = 1일)
        document.getElementById('annivList').classList.remove('hidden');
        document.getElementById('resultTitle').innerText = '오늘 기준 경과일';
        
        const passedDays = Math.round((today.getTime() - selected.getTime()) / (1000 * 60 * 60 * 24)) + 1;
        document.getElementById('mainDdayResult').innerText = `${passedDays}일째`;
        document.getElementById('subDdayNote').innerText = `시작일로부터 오늘이 ${passedDays}일째 되는 날입니다.`;

        const getFutureDate = (base, addDays) => {
          const res = new Date(base);
          res.setDate(res.getDate() + (addDays - 1));
          return `${res.getFullYear()}년 ${res.getMonth() + 1}월 ${res.getDate()}일`;
        };

        document.getElementById('d100').innerText = getFutureDate(selected, 100);
        document.getElementById('d200').innerText = getFutureDate(selected, 200);
        document.getElementById('d365').innerText = getFutureDate(selected, 365);
        document.getElementById('d1000').innerText = getFutureDate(selected, 1000);
      }

      document.getElementById('resultBox').classList.remove('hidden');
    }
  </script>
</body>
</html>

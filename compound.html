<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>복리 수익률 계산기 | 적립식 투자·목돈 굴리기</title>
  <meta name="description" content="초기 원금과 매월 추가 납입액, 연 수익률에 따른 복리 수익 및 최종 만기 자산을 즉시 계산합니다.">
  
  <!-- 구글 애드센스 메타 태그 & 스크립트 -->
  <meta name="google-adsense-account" content="ca-pub-6122968996738347">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6122968996738347" crossorigin="anonymous"></script>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased py-10 px-4">

  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg border border-gray-100 p-6 md:p-8">
    
    <!-- 상단 탭 -->
    <nav class="flex flex-wrap gap-2 justify-between items-center mb-6 border-b pb-3 text-xs md:text-sm">
      <div class="flex gap-3">
        <a href="/" class="text-gray-500 hover:text-blue-600">대출</a>
        <a href="/deposit.html" class="text-gray-500 hover:text-blue-600">예적금</a>
        <a href="/salary.html" class="text-gray-500 hover:text-blue-600">연봉</a>
        <a href="/realtor.html" class="text-gray-500 hover:text-blue-600">복비</a>
      </div>
      <span class="text-blue-600 font-bold">복리 계산기</span>
    </nav>

    <header class="text-center mb-6">
      <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2">복리 투자 수익률 계산기</h1>
      <p class="text-sm text-gray-500">초기 투자금과 월 납입액으로 복리 증식 자산을 계산합니다.</p>
    </header>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">초기 투자 원금 (원)</label>
        <input type="text" id="initPrincipal" placeholder="10,000,000" oninput="formatCurrency(this)"
               class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-base">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">매월 추가 납입액 (원, 선택)</label>
        <input type="text" id="monthlyContribution" placeholder="500,000" oninput="formatCurrency(this)"
               class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-base">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">연 목표 수익률 (%)</label>
          <input type="number" step="0.1" id="annualReturn" placeholder="8.0" 
                 class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-base">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">투자 기간 (년)</label>
          <input type="number" id="investYears" placeholder="10" 
                 class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-base">
        </div>
      </div>

      <button onclick="calculateCompound()" 
              class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg transition duration-200 shadow-md">
        복리 수익 계산하기
      </button>
    </div>

    <!-- 결과 영역 -->
    <div id="resultBox" class="hidden mt-8 pt-6 border-t border-gray-200">
      <h2 class="text-lg font-bold text-gray-900 mb-4">📈 복리 시뮬레이션 결과</h2>
      
      <div class="bg-blue-50 p-5 rounded-xl mb-6 text-center">
        <span class="text-xs text-blue-600 font-semibold">최종 예상 총 자산</span>
        <p id="totalAsset" class="text-2xl md:text-3xl font-black text-blue-900 mt-1">0원</p>
      </div>

      <div class="bg-gray-50 p-4 rounded-xl text-sm space-y-2.5">
        <div class="flex justify-between">
          <span class="text-gray-600">총 투자 원금:</span>
          <span id="displayTotalPrincipal" class="font-semibold text-gray-800">0원</span>
        </div>
        <div class="flex justify-between text-red-600 font-semibold">
          <span>복리 투자 수익 (이자):</span>
          <span id="displayTotalProfit">+ 0원</span>
        </div>
        <div class="flex justify-between pt-2 border-t border-gray-200 font-bold text-gray-900">
          <span>원금 대비 총 수익률:</span>
          <span id="displayReturnRate" class="text-blue-600">0%</span>
        </div>
      </div>
    </div>

    <article class="mt-8 pt-6 border-t border-gray-100 text-sm text-gray-600 leading-relaxed space-y-3">
      <h3 class="font-bold text-gray-900">복리(Compound Interest)의 원리</h3>
      <p>
        복리는 발생한 수익(이자)이 다시 원금에 더해져 다음 주기의 이자를 만들어내는 구조입니다. 투자 기간이 길어질수록 자산 증가 속도가 지수함수 형태로 가속화됩니다.
      </p>
    </article>

  </div>

  <script>
    function formatCurrency(target) {
      let val = target.value.replace(/[^0-9]/g, '');
      target.value = val ? Number(val).toLocaleString() : '';
    }

    function calculateCompound() {
      const rawInit = document.getElementById('initPrincipal').value.replace(/,/g, '');
      const initPrincipal = parseFloat(rawInit) || 0;
      const rawMonthly = document.getElementById('monthlyContribution').value.replace(/,/g, '');
      const monthlyContribution = parseFloat(rawMonthly) || 0;
      const annualReturn = parseFloat(document.getElementById('annualReturn').value);
      const investYears = parseInt(document.getElementById('investYears').value);

      if ((initPrincipal <= 0 && monthlyContribution <= 0) || !annualReturn || !investYears || annualReturn <= 0 || investYears <= 0) {
        alert('투자 금액, 수익률, 기간을 올바르게 입력해 주세요.');
        return;
      }

      const totalMonths = investYears * 12;
      const monthlyRate = (annualReturn / 100) / 12;

      let currentBalance = initPrincipal;
      let totalInvestedPrincipal = initPrincipal;

      for (let m = 0; m < totalMonths; m++) {
        currentBalance = currentBalance * (1 + monthlyRate) + monthlyContribution;
        totalInvestedPrincipal += monthlyContribution;
      }

      const totalProfit = Math.round(currentBalance - totalInvestedPrincipal);
      const finalAsset = Math.round(currentBalance);
      const returnRate = ((totalProfit / totalInvestedPrincipal) * 100).toFixed(1);

      document.getElementById('totalAsset').innerText = finalAsset.toLocaleString() + ' 원';
      document.getElementById('displayTotalPrincipal').innerText = Math.round(totalInvestedPrincipal).toLocaleString() + ' 원';
      document.getElementById('displayTotalProfit').innerText = '+ ' + totalProfit.toLocaleString() + ' 원';
      document.getElementById('displayReturnRate').innerText = '+' + returnRate + ' %';

      document.getElementById('resultBox').classList.remove('hidden');
    }
  </script>
</body>
</html>

name: Apply stock scanner score guide
on:
  push:
    paths:
      - '.github/workflows/apply-stock-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Inject score guide script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('stock/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/stock/score-guide.js?v=20260905"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('closing body tag not found')
              s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Show MODU score explanation on stock scanner"
          git push

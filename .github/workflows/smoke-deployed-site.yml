name: Smoke Deployed Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'smoke_site.py'
      - '.github/workflows/smoke-deployed-site.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for Vercel deployment to settle
        run: sleep 20
      - name: Check public pages and ads.txt
        id: smoke
        continue-on-error: true
        run: python smoke_site.py
      - name: Commit external readiness report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/deployment-smoke.md
          git diff --cached --quiet && exit 0
          git commit -m 'Record deployed-site accessibility checks'
          git pull --rebase origin main
          git push
      - name: Fail if a live page cannot be verified
        if: steps.smoke.outcome == 'failure'
        run: exit 1

name: Fix minesweeper mobile scroll

on:
  push:
    branches: [main]
    paths:
      - "fix_minesweeper_mobile_scroll.py"
      - ".github/workflows/fix-minesweeper-mobile-scroll.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch mobile scrolling
        run: python fix_minesweeper_mobile_scroll.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/minesweeper/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix minesweeper scrolling on mobile"
          git pull --rebase origin main
          git push

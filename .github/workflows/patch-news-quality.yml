name: Patch homepage news quality filters

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-news-quality.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch news collector quality filters
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('update_news.py')
          s=p.read_text(encoding='utf-8')
          marker='date_badge = datetime.now(kst).strftime("%Y.%m.%d")\n'
          block='''\n# AdSense/검색 품질 보호: 도박·성인·스팸성 제목은 홈 뉴스에 노출하지 않음.\nBLOCKED_NEWS_TERMS = (\n    "토토", "토토사이트", "스포츠토토", "카지노", "바카라", "슬롯",\n    "도박", "베팅", "먹튀", "성인사이트", "성인 사이트", "포르노",\n    "porn", "casino", "betting", "gambling"\n)\nBLOCKED_NEWS_SOURCES = ("Histoire pour tous",)\n\ndef is_blocked_news(title, source=""):\n    hay=(str(title)+" "+str(source)).lower().replace(" ", "")\n    if any(term.lower().replace(" ", "") in hay for term in BLOCKED_NEWS_TERMS):\n        return True\n    return any(src.lower() in str(source).lower() for src in BLOCKED_NEWS_SOURCES)\n\n'''
          if 'BLOCKED_NEWS_TERMS' not in s:
              if marker not in s:
                  raise SystemExit('date_badge marker not found')
              s=s.replace(marker, marker+block, 1)
          old='''                items.append({"title": title, "link": link, "source": source})'''
          new='''                if is_blocked_news(title, source):\n                    print(f"FILTERED NEWS: {title} - {source}")\n                    continue\n                items.append({"title": title, "link": link, "source": source})'''
          if new not in s:
              if old not in s:
                  raise SystemExit('items.append marker not found')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Rebuild homepage with filtered news
        run: |
          pip install feedparser
          python update_news.py
          if [ -f lotto/update_home_lotto.py ] && [ -f lotto/data/results.json ]; then
            python lotto/update_home_lotto.py
          fi
      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-news-quality.yml
          git add update_news.py index.html
          git commit -m "Filter gambling and spam news from homepage"
          git pull --rebase origin main
          git push

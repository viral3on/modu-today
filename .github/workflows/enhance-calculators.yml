name: Enhance calculators
on:
  workflow_dispatch:
  push:
    branches: [seo-calculator-redesign]
    paths:
      - 'enhance_calculators.py'
      - 'calculator/theme.css'
      - 'calculator/theme.js'
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply calculator SEO and design
        run: python enhance_calculators.py
      - name: Refresh sitemap
        run: python generate_sitemap.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculator/*.html sitemap.xml
          git diff --cached --quiet || git commit -m "Apply calculator redesign and SEO"
          git push

name: Update stock scanner

on:
  schedule:
    # KRX OPEN API 실제 당일 반영시각을 측정하기 위한 임시 모니터링
    # 평일 18:30 KST = 09:30 UTC
    - cron: "30 9 * * 1-5"
    # 평일 21:30 KST = 12:30 UTC
    - cron: "30 12 * * 1-5"
    # 장 종료일 다음날 00:30 KST = 전날 15:30 UTC
    - cron: "30 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Test KRX API key
        run: |
          if [ -z "$KRX_API_KEY" ]; then
            echo "KRX_API_KEY secret is missing"
            exit 1
          fi
          echo "KRX_API_KEY secret exists"
      - name: Build KRX stock scanner data
        run: python -u stock/update_stock.py
      - name: Update sitemap
        run: |
          if [ -f generate_sitemap.py ]; then python generate_sitemap.py; fi
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock/data/scanner.json stock/data/snapshot.json
          if [ -f stock/data/availability_log.json ]; then git add stock/data/availability_log.json; fi
          if [ -f sitemap.xml ]; then git add sitemap.xml; fi
          if git diff --cached --quiet; then
            echo "No stock scanner changes."
            exit 0
          fi
          git commit -m "Update KRX stock scanner data"
          git push

name: Update stock scanner

on:
  schedule:
    - cron: '20 9 * * 1-5'
    - cron: '40 9 * * 1-5'
    - cron: '0 10 * * 1-5'
    - cron: '0 11 * * 1-5'
    - cron: '0 13 * * 1-5'
    - cron: '40 22 * * *'
    - cron: '20 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Suspended at the site owner's request until the right to publicly display
# and monetize KRX OPEN API data has been confirmed. No API calls or writes.
jobs:
  update:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'KRX public data service is temporarily suspended.'

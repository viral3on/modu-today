name: Update stock scanner

on:
  schedule:
    # 평일 장 종료 후 여러 차례 확인
    - cron: "30 9 * * 1-5"   # 18:30 KST
    - cron: "30 12 * * 1-5"  # 21:30 KST
    - cron: "30 15 * * 1-5"  # 00:30 KST
    # 다음날 아침 재확인. 직전 평일 데이터를 1시간 간격으로 재확인
    - cron: "30 22 * * 0-4"  # 07:30 KST
    - cron: "30 23 * * 0-4"  # 08:30 KST
    - cron: "30 0 * * 1-5"   # 09:30 KST
    - cron: "30 1 * * 1-5"   # 10:30 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Test KRX API key
        run: |
          if [ -z "$KRX_API_KEY" ]; then
            echo "KRX_API_KEY secret is missing"
            exit 1
          fi
          echo "KRX_API_KEY secret exists"
      - name: Build KRX stock scanner data
        run: python -u stock/update_stock.py
      - name: Update sitemap
        run: |
          if [ -f generate_sitemap.py ]; then python generate_sitemap.py; fi
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock/data/scanner.json stock/data/snapshot.json
          if [ -f stock/data/availability_log.json ]; then git add stock/data/availability_log.json; fi
          if [ -f sitemap.xml ]; then git add sitemap.xml; fi
          if git diff --cached --quiet; then
            echo "No stock scanner changes."
            exit 0
          fi
          git commit -m "Update KRX stock scanner data"
          if ! git push; then
            echo "Remote changed while stock data was being built; rebasing and retrying."
            git pull --rebase origin main
            if [ -f generate_sitemap.py ]; then python generate_sitemap.py; fi
            if [ -f sitemap.xml ]; then git add sitemap.xml; fi
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
            git push
          fi

name: Update Sitemap

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "generate_sitemap.py"

  schedule:
    - cron: "23 4 * * *"
      timezone: "Asia/Seoul"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modu-derived-html-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Generate sitemap.xml
        run: python generate_sitemap.py

      - name: Commit sitemap if changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml has no changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml
          git commit -m "Update sitemap"

          if ! git push; then
            echo "Remote changed while sitemap was being generated; rebasing and regenerating."
            git pull --rebase origin main
            python generate_sitemap.py
            git add sitemap.xml
            git commit --amend --no-edit
            git push
          fi

name: Audit Site Content

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit_content.py'
      - '.github/workflows/audit-site-content.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit published HTML and create inventory
        run: python audit_content.py
      - name: Commit report only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/content-audit.md
          git diff --cached --quiet && exit 0
          git commit -m 'Update site content audit inventory'
          git pull --rebase origin main
          git push

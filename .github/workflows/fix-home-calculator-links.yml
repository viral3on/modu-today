name: Fix homepage calculator links
on:
  push:
    branches: [seo-calculator-redesign]
    paths: ['fix_home_calculator_links.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python fix_home_calculator_links.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update_news.py
          git diff --cached --quiet || git commit -m "Fix homepage calculator URLs"
          git push

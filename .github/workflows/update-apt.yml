name: Update apartment trades
on:
  workflow_dispatch:
  schedule:
    - cron: "20 22 * * *" # 07:20 KST
permissions:
  contents: write
concurrency:
  group: apartment-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update nationwide apartment trades
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: python -u apt/update_apt.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apt/data/trades.json apt/data/apartments.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update nationwide apartment trade data"
          git push

name: Update apartment trades
on:
  workflow_dispatch:
  schedule:
    - cron: "20 22 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update apartment trades
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          MOLIT_APT_ENDPOINT: ${{ secrets.MOLIT_APT_ENDPOINT }}
        run: python apt/update_apt.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apt/data/trades.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update apartment trade data"
          git push

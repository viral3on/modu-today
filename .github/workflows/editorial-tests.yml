name: Editorial and existing feature checks
on:
  pull_request:
  push:
    branches: [main]
    paths: ['lib/**', 'api/**', 'admin/**', 'scripts/**', 'content/**', 'assets/**', 'tests/**', 'package.json', 'package-lock.json', 'vercel.json', 'update_news.py']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -v
      - run: npm run build

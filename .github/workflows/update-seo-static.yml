name: Update SEO Static HTML

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "calculator/theme.js"
      - "calculator/theme.css"
      - "seo_catalog.py"
      - "crawl_structure.py"
      - "generate_sitemap.py"
      - "validate_crawl.py"
      - "tests/test_crawl.py"
      - "seo_static.py"
      - "enhance_detail_seo.py"
      - "cleanup_empty_seo.py"
      - ".github/workflows/update-seo-static.yml"
  workflow_run:
    workflows:
      - "Update stock scanner"
      - "Update YouTube Ranking"
      - "Update Lotto Results"
      - "Update apartment trades"
    types: [completed]
  schedule:
    - cron: "10 16 * * *"

permissions:
  contents: write

concurrency:
  group: modu-derived-html-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Remove stale SEO snapshots with missing source data
        run: python cleanup_empty_seo.py
      - name: Render static SEO content
        run: python seo_static.py
      - name: Enhance calculator and game detail SEO
        run: python enhance_detail_seo.py
      - name: Generate static crawl links
        run: python crawl_structure.py
      - name: Regenerate sitemap
        run: python generate_sitemap.py
      - name: Validate crawl structure
        run: python validate_crawl.py
      - name: Test crawl generation
        run: python -m unittest discover -s tests -v
      - name: Commit rendered pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock/index.html youtube/index.html lotto/index.html apt/index.html calculator/*.html games/index.html games/*/index.html sitemap.xml docs/url-inventory.md
          git diff --cached --quiet && exit 0
          git commit -m "Update static SEO snapshots"

          if ! git push; then
            echo "Remote changed while SEO snapshot was being rendered; rebasing and rerendering."
            git pull --rebase origin main
            python cleanup_empty_seo.py
            python seo_static.py
            python enhance_detail_seo.py
            python crawl_structure.py
            python generate_sitemap.py
            python validate_crawl.py
            git add stock/index.html youtube/index.html lotto/index.html apt/index.html calculator/*.html games/index.html games/*/index.html sitemap.xml docs/url-inventory.md
            git commit --amend --no-edit
            git push
          fi

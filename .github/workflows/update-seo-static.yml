name: Update SEO Static HTML

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "calculator/theme.js"
      - "calculator/theme.css"
      - "seo_catalog.py"
      - "crawl_structure.py"
      - "generate_sitemap.py"
      - "validate_crawl.py"
      - "tests/test_crawl.py"
      - "seo_static.py"
      - "enhance_detail_seo.py"
      - "cleanup_empty_seo.py"
      - "lotto_history_insights.py"
      - "lotto_draw_context.py"
      - "site_footer.py"
      - ".github/workflows/update-seo-static.yml"
  workflow_run:
    workflows:
      - "Update stock scanner"
      - "Update YouTube Ranking"
      - "Update Lotto Results"
      - "Update apartment trades"
    types: [completed]
  schedule:
    - cron: "10 16 * * *"

permissions:
  contents: write

concurrency:
  group: modu-derived-html-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Remove stale SEO snapshots with missing source data
        run: python cleanup_empty_seo.py
      - name: Render static SEO content
        run: python seo_static.py
      - name: Enhance calculator and game detail SEO
        run: python enhance_detail_seo.py
      - name: Verify lotto history examples and idempotence
        run: |
          python - <<'PY'
          from lotto_history_insights import render, apply, START
          fixture={'draws':[{'draw':100-i,'numbers':[1,2,3,4,5,6]} for i in range(25)]}
          section=render(fixture)
          assert '25개 회차' in section and '21.0' in section
          text='<main class="list">history</main>'
          once=apply(text,section)
          assert once==apply(once,section) and once.count(START)==1
          assert not render({'draws':[{'draw':1,'numbers':[1,1,2,3,4,5]}]*25})
          print('Historical lotto comparison tests passed')
          PY
      - name: Add verified historical lotto comparison
        run: python lotto_history_insights.py
      - name: Test factual per-draw context and idempotence
        run: |
          python - <<'PY'
          from lotto_draw_context import valid_rows, render, apply, START, ANCHOR
          rows=valid_rows({'draws':[
            {'draw':3,'numbers':[1,2,3,4,5,6]},
            {'draw':2,'numbers':[1,2,3,7,8,9]},
            {'draw':1,'numbers':[10,11,12,13,14,15]}]})
          section=render(3,rows)
          assert '3개(1, 2, 3)' in section and '1번 2회' in section
          assert '당첨 확률을 예측하지 않습니다' in section and '다음 4회' not in section
          source='<html><body>'+ANCHOR+' sample</body></html>'
          once=apply(source,section)
          assert once==apply(once,section) and once.count(START)==1
          assert ANCHOR in once and render(22,rows)==''
          assert len(valid_rows({'draws':[{'draw':1,'numbers':[1,1,2,3,4,5]},{'draw':2,'numbers':[1,2,3,4,5,6]}]}))==1
          print('Per-draw lotto context tests passed')
          PY
      - name: Add per-draw comparison and adjacent navigation
        run: python lotto_draw_context.py
      - name: Generate static crawl links
        run: python crawl_structure.py
      - name: Test shared footer insertion and idempotence
        run: python site_footer.py --test
      - name: Add site information links to all published pages
        run: python site_footer.py
      - name: Verify shared footer links on all published pages
        run: python site_footer.py --check
      - name: Regenerate sitemap
        run: python generate_sitemap.py
      - name: Validate crawl structure
        run: python validate_crawl.py
      - name: Test crawl generation
        run: python -m unittest discover -s tests -v
      - name: Commit rendered pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet && exit 0
          git commit -m "Update SEO snapshots and consistent footer navigation"

          if ! git push; then
            echo "Remote changed while SEO snapshot was being rendered; rebasing and rerendering."
            git pull --rebase origin main
            python cleanup_empty_seo.py
            python seo_static.py
            python enhance_detail_seo.py
            python lotto_history_insights.py
            python lotto_draw_context.py
            python crawl_structure.py
            python site_footer.py
            python site_footer.py --check
            python generate_sitemap.py
            python validate_crawl.py
            git add -u
            git commit --amend --no-edit
            git push
          fi

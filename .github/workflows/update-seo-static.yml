name: Update SEO Static HTML

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update stock scanner"
      - "Update YouTube Ranking"
      - "Update Lotto Results"
      - "Update apartment trades"
    types: [completed]
  schedule:
    - cron: "10 16 * * *"

permissions:
  contents: write

jobs:
  render:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render static SEO content
        run: python seo_static.py
      - name: Regenerate sitemap
        run: python generate_sitemap.py
      - name: Commit rendered pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock/index.html youtube/index.html lotto/index.html apt/index.html sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "Update static SEO snapshots"
          git push

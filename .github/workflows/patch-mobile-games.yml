name: Patch mobile game controls

on:
  push:
    branches: [main]
    paths:
      - "patch_mobile_games.py"
      - ".github/workflows/patch-mobile-games.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch mobile controls
        run: python patch_mobile_games.py
      - name: Commit patched game pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/minesweeper/index.html games/block-game/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Improve mobile minesweeper and block game controls"
          git push

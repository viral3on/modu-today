name: Update YouTube Ranking

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python youtube/update_youtube.py

      - name: Commit updated ranking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube/data
          git diff --cached --quiet || git commit -m "Update YouTube ranking"
          git push

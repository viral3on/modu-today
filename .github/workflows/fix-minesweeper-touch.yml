name: Fix minesweeper mobile touch

on:
  push:
    paths:
      - 'fix_minesweeper_touch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply mobile touch fix
        run: python fix_minesweeper_touch.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/minesweeper/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Make minesweeper long press reliable on mobile"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 3
          done
          exit 1

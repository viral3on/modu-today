name: Auto Update Market News

on:
  schedule:
    - cron: '0 0 * * *' # 매일 자정 실행 (원하시는 시간으로 조정 가능)
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install feedparser

      - name: 뉴스 수집 및 index.html 자동 생성
        run: |
          python update_news.py

      - name: 변경사항 자동 커밋 및 푸시
        run: |
          git config --global user.name "MarketBot"
          git config --global user.email "bot@example.com"
          git add index.html
          git commit -m "Auto-update market news index.html" || exit 0
          git push

name: Auto Update Market News

on:
  schedule:
    # UTC 22:00 = 한국 시간(KST) 매일 아침 07:00
    - cron: '0 22 * * *'
  workflow_dispatch: # 관리자가 수동으로 즉시 갱신하고 싶을 때 버튼 클릭 지원

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install feedparser

      - name: 뉴스 수집 및 news.html 자동 생성
        run: |
          python update_news.py

      - name: 변경사항 자동 커밋 및 푸시
        run: |
          git config --global user.name "MarketBot"
          git config --global user.email "bot@modu.today"
          git add news.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update: Daily Market Briefing [$(date +'%Y-%m-%d %H:%M')]" && git push)

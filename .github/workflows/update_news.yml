name: Auto Update Market News

on:
  schedule:
    # GitHub Actions cron은 UTC 기준입니다.
    # 아래 실행 시각은 한국시간(KST) 기준: 06:00 / 09:00 / 12:00 / 15:00 / 18:00 / 21:00
    - cron: '0 21 * * *' # 06:00 KST
    - cron: '0 0 * * *'  # 09:00 KST
    - cron: '0 3 * * *'  # 12:00 KST
    - cron: '0 6 * * *'  # 15:00 KST
    - cron: '0 9 * * *'  # 18:00 KST
    - cron: '0 12 * * *' # 21:00 KST
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install feedparser

      - name: 뉴스 수집 및 index.html 자동 생성
        run: |
          python update_news.py

      - name: 변경사항 자동 커밋 및 푸시
        run: |
          git config --global user.name "MarketBot"
          git config --global user.email "bot@example.com"
          git add index.html
          git commit -m "Auto-update market news index.html" || exit 0
          git push

name: Refresh stock scanner now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-stock-now.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Refresh KRX stock scanner
        run: python -u stock/update_stock.py
      - name: Render stock SEO and sitemap
        run: |
          python seo_static.py
          python generate_sitemap.py
      - name: Commit refreshed stock data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock/data/scanner.json stock/data/snapshot.json stock/index.html sitemap.xml
          if [ -f stock/data/availability_log.json ]; then git add stock/data/availability_log.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Refresh KRX stock scanner"
          if ! git push; then
            echo "Remote changed during refresh; rebasing and retrying."
            git pull --rebase origin main
            python seo_static.py
            python generate_sitemap.py
            git add stock/data/scanner.json stock/data/snapshot.json stock/index.html sitemap.xml
            if [ -f stock/data/availability_log.json ]; then git add stock/data/availability_log.json; fi
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
            git push
          fi

# manual refresh trigger: 2026-09-05 KST

name: Fix apartment SEO fields

on:
  push:
    branches: [main]
    paths:
      - "fix_apt_seo_fields.py"
      - ".github/workflows/fix-apt-seo-fields.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch SEO field mapping
        run: python fix_apt_seo_fields.py
      - name: Regenerate static SEO
        run: python seo_static.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo_static.py apt/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix apartment SEO names and prices"
          git push

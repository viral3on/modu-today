name: Update Lotto Results

on:
  schedule:
    # 토요일 21:50 KST / 일요일 09:30 KST
    - cron: "50 12 * * 6"
    - cron: "30 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lotto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Update lotto results
        run: python lotto/update_lotto.py

      - name: Commit lotto data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 먼저 add 해야 새로 생성된(untracked) results.json도 변경사항으로 감지됩니다.
          git add lotto/data/results.json

          if git diff --cached --quiet; then
            echo "No lotto data changes."
            exit 0
          fi

          git commit -m "Update lotto results"
          git push

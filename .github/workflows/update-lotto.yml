name: Update Lotto Results

on:
  schedule:
    # 토요일 21:50 KST / 일요일 09:30 KST
    - cron: "50 12 * * 6"
    - cron: "30 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lotto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Update lotto results and draw pages
        run: python lotto/update_lotto.py

      - name: Update sitemap
        run: |
          if [ -f generate_sitemap.py ]; then
            python generate_sitemap.py
          else
            echo "generate_sitemap.py not found; skipping sitemap generation."
          fi

      - name: Commit lotto data and draw pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lotto/

          if [ -f sitemap.xml ]; then
            git add sitemap.xml
          fi

          if git diff --cached --quiet; then
            echo "No lotto data or page changes."
            exit 0
          fi

          git commit -m "Update lotto results and draw pages"
          git push

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>아파트 실거래가 조회 | MODU.TODAY</title><meta name="description" content="국토교통부 아파트 매매 실거래가를 지역과 아파트명으로 간편하게 조회하세요."><style>
:root{--b:#f5f7fb;--c:#fff;--t:#182033;--m:#697386;--l:#e5e9f0;--a:#3867e8}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Arial,"Noto Sans KR",sans-serif}nav{background:#111827;padding:14px 18px;display:flex;gap:17px;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;font-weight:700}main{max-width:1100px;margin:auto;padding:34px 18px}.hero h1{font-size:34px;margin:0}.hero p,.muted{color:var(--m)}.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:22px;margin-top:20px}.search{display:grid;grid-template-columns:1fr 1.4fr auto;gap:10px}select,input,button{font:inherit;padding:13px;border-radius:10px;border:1px solid #d8dde6}button{background:var(--a);color:white;border:0;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f7f9fd;padding:14px;border-radius:12px}.stat small{display:block;color:var(--m)}.stat b{font-size:20px}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px;border-bottom:1px solid var(--l);text-align:left}th{background:#f8fafc}.price{font-weight:800}footer{text-align:center;color:var(--m);padding:30px}@media(max-width:700px){.search{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style></head><body><nav><a href="/">📰 뉴스</a><a href="/youtube/">📺 YouTube 순위</a><a href="/calculator/">🧮 계산기</a><a href="/games/">🎮 게임</a><a href="/lotto/">🍀 로또</a><a href="/apt/">🏠 실거래가</a><a href="/yasun.html">🌙 야간선물</a></nav><main><div class="hero"><h1>🏠 아파트 실거래가 조회</h1><p>국토교통부에 신고된 아파트 매매 실거래 자료를 지역과 아파트명으로 조회합니다.</p></div><section class="card"><div class="search"><select id="region"><option value="">전체 지역</option></select><input id="q" placeholder="아파트명 또는 법정동 검색"><button onclick="render()">조회</button></div><p id="updated" class="muted"></p></section><section class="card"><h2 id="title">최근 아파트 매매 실거래</h2><div class="stats"><div class="stat"><small>거래수</small><b id="cnt">-</b></div><div class="stat"><small>평균</small><b id="avg">-</b></div><div class="stat"><small>최고</small><b id="hi">-</b></div><div class="stat"><small>최저</small><b id="lo">-</b></div></div><div class="wrap"><table><thead><tr><th>계약일</th><th>지역</th><th>아파트</th><th>전용면적</th><th>층</th><th>거래금액</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="card"><b>안내</b><p class="muted">실거래 신고자료는 취소·정정 등에 따라 변경될 수 있으며 시세나 감정가격이 아닌 신고된 거래내역입니다.</p></section></main><footer>© MODU.TODAY · Jae-Hyun Kim.</footer><script>
let T=[];const W=n=>n>=10000?Math.floor(n/10000)+"억"+(n%10000?" "+(n%10000).toLocaleString()+"만원":""):n.toLocaleString()+"만원";
Promise.all([fetch("/apt/data/trades.json?"+Date.now()).then(r=>r.json()),fetch("/apt/data/regions.json").then(r=>r.json())]).then(([d,rs])=>{T=d.trades||[];region.innerHTML='<option value="">전체 지역</option>'+rs.map(x=>`<option value="${x.code}">${x.name}</option>`).join("");updated.textContent=d.updated_at?"최근 갱신: "+d.updated_at.replace("T"," "):"데이터 준비 중";render()});
q.onkeydown=e=>{if(e.key==="Enter")render()};function render(){let s=q.value.trim().toLowerCase(),rc=region.value,a=T.filter(x=>(!rc||x.region_code===rc)&&(!s||(x.apt+" "+x.dong).toLowerCase().includes(s))),p=a.map(x=>x.price_manwon).filter(Boolean);cnt.textContent=a.length.toLocaleString()+"건";avg.textContent=p.length?W(Math.round(p.reduce((a,b)=>a+b,0)/p.length)):"-";hi.textContent=p.length?W(Math.max(...p)):"-";lo.textContent=p.length?W(Math.min(...p)):"-";title.textContent=s?`"${q.value.trim()}" 최근 실거래`:"최근 아파트 매매 실거래";rows.innerHTML=a.slice(0,300).map(x=>`<tr><td>${x.date}</td><td>${x.region}<br><span class="muted">${x.dong}</span></td><td><b>${x.apt}</b></td><td>${x.area}㎡</td><td>${x.floor}층</td><td class="price">${W(x.price_manwon)}</td></tr>`).join("")||'<tr><td colspan="6" class="muted">검색 결과가 없습니다.</td></tr>'}
</script><script defer src="/_vercel/insights/script.js"></script></body></html>
